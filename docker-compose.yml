services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitocam
      POSTGRES_USER: monitocam
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitocam"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - /mnt/nas-pictures/monitocam:/var/lib/monitocam/recordings
      - ./backend/config.yaml:/app/config.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DATABASE_URL=postgresql://monitocam:${DB_PASSWORD:-postgres}@postgres:5432/monitocam
      - REDIS_URL=redis://redis:6379/0
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - CONFIG_YAML_PATH=/app/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A config.celery worker --loglevel=info --concurrency=1 --pool=prefork -Q recordings,media,maintenance
    volumes:
      - /mnt/nas-pictures/monitocam:/var/lib/monitocam/recordings
      - ./backend/config.yaml:/app/config.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DATABASE_URL=postgresql://monitocam:${DB_PASSWORD:-postgres}@postgres:5432/monitocam
      - REDIS_URL=redis://redis:6379/0
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - CONFIG_YAML_PATH=/app/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DATABASE_URL=postgresql://monitocam:${DB_PASSWORD:-postgres}@postgres:5432/monitocam
      - REDIS_URL=redis://redis:6379/0
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - CONFIG_YAML_PATH=/app/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    profiles:
      - prod

volumes:
  postgres_data:
  redis_data:
